name: ViLilt
options:
  bundleIdPrefix: org.viaiforgood
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 5
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ViLilt:
    type: application
    platform: iOS
    sources:
      - path: ViLilt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.viaiforgood.vililt
        DEVELOPMENT_TEAM: 43SKUJ8Z35
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ViLilt/ViLilt.entitlements
        INFOPLIST_FILE: ViLilt/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "viLilt"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  ViLiltTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ViLiltTests
    dependencies:
      - target: ViLilt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.viaiforgood.vililt.tests
        DEVELOPMENT_TEAM: 43SKUJ8Z35
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
